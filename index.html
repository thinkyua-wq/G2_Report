function exportMileXlsx(){
  const q=((document.getElementById('fQ')||{}).value||'').trim().toLowerCase();
  let list=MILESTONES.map((x,i)=>({x,i})).filter(o=>(!q||o.x.name.toLowerCase().includes(q)||(o.x.info||'').toLowerCase().includes(q))
    &&(!MILECTRY||(o.x.country||'중국')===MILECTRY)&&(!MILEMGR||ownerOf(o.x)===MILEMGR));
  const sc=MILESORT.col, dir=MILESORT.dir;
  if(sc){list.sort((a,b)=>{let va,vb;if(sc==='month'){va=+a.x.month||0;vb=+b.x.month||0;}else if(sc==='cat'){va=MCATLB[a.x.cat]||'';vb=MCATLB[b.x.cat]||'';}else{va=String(a.x[sc]||'');vb=String(b.x[sc]||'');}return (va<vb?-1:va>vb?1:0)*dir;});}
  else list.sort((a,b)=>(a.x.month-b.x.month)||String(a.x.date).localeCompare(String(b.x.date)));
  const aoa=[['No','월','국가','구분','일정명','내용개요','비고']];
  list.forEach((o,n)=>{const x=o.x;aoa.push([n+1, x.month||'', x.country||'중국', (MCATLB[x.cat]||x.cat||''), x.name||'', x.info||'', x.link||'']);});
  ensureXLSX(()=>{
    try{
      const ws=XLSX.utils.aoa_to_sheet(aoa);
      ws['!cols']=[{wch:5},{wch:5},{wch:8},{wch:12},{wch:28},{wch:52},{wch:32}];
      const wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb,ws,'중화팀 행사 일정');
      XLSX.writeFile(wb,`중화팀_행사_일정목록_${YEAR}.xlsx`);
      toast(`엑셀로 내보냈습니다 (${list.length}건)`);
    }catch(e){toast('엑셀 내보내기 오류: '+((e&&e.message)||''));}
  });
}

  h+=`<div style="overflow-x:auto"><table class="ptable rrtbl rrtbl4"><thead><tr><th style="width:16%">구분</th><th style="width:16%;text-align:left">담당</th><th style="width:34%;text-align:left">업무 R&R</th><th style="width:34%;text-align:left">성과지표</th></tr></thead><tbody>`;
  RRDATA.forEach((r,i)=>{
    if(RRSEL!==''&&RRSEL!==i)return;
    h+=`<tr>
      <td class="rl rr-who"><div class="rrw-grp">${esc(r.grp)}</div><div class="rrw-nm">${esc(r.who)}</div></td>
      <td class="rl"><textarea class="rr-cell" oninput="autogrow(this)" onchange="editRR(${i},'role',this.value)">${esc(r.role||'')}</textarea></td>
      <td class="rl"><textarea class="rr-cell" oninput="autogrow(this)" onchange="editRR(${i},'work',this.value)">${esc(r.work)}</textarea></td>
      <td class="rl"><textarea class="rr-cell" oninput="autogrow(this)" onchange="editRR(${i},'kpi',this.value)">${esc(r.kpi)}</textarea></td>
    </tr>`;});
  return h+'</tbody></table></div></div>';
}

function gsCountryRate(kind){
  const D=(typeof SPCUR!=='undefined'&&SPCUR&&SPCUR.deal)||(typeof SPERF!=='undefined'&&SPERF&&SPERF.deal)||(typeof DEALSEED!=='undefined'?DEALSEED:[]);
  const pick=d=>kind==='중국'?d.grp==='중국':(kind==='대만'?/대만/.test(d.dealer):/홍콩/.test(d.dealer));
  let t=0,a=0;(D||[]).filter(pick).forEach(d=>{t+=(+d.exT||0);a+=(+d.exA||0);});
  return t?a/t:null;
}

function chartSVG(S,sel,mt){

  for(let g=0;g<=4;g++){const y=yb-(g/4)*ph;grid+=`<line x1="${ml}" y1="${y}" x2="${W-mr}" y2="${y}" stroke="#eef" stroke-width="1"/><text x="${ml-8}" y="${y+4}" font-size="11" fill="#9498a3" text-anchor="end">${Math.round(maxV*g/4).toLocaleString()}</text><text x="${W-mr+8}" y="${y+4}" font-size="11" fill="#9498a3" text-anchor="start">${g*30}%</text>`;}

  }

  rows.forEach(o=>{
    const nm=String(svPick(o,['핵심과제','주요활동'])||'').trim(); if(!nm||/^◀/.test(nm)||/^예\)/.test(nm))return;
    const who=mgrByName(svPick(o,['담당자']));
    let p=progOf(svPick(o,['진행율','진행률'])); const status=p!=null?(p>=100?'완료':(p<=0?'대기':'진행중')):'진행중'; if(p==null)p=50;
    const note=String(svPick(o,['진행사항','비고'])||'').trim();
    const nextW=String(svPick(o,['차주','차주업무'])||'').trim();
    const tIdx=slotOf(o);
    const wk=WEEKS.map((_,k)=>k===tIdx?{p:p,note:note}:null);
    const prio=PRK[String(svPick(o,['우선순위'])||'').trim()]||'중간';
    const stR=toDateStr(svPick(o,['시작일'])); const st0=(stR&&/\d{4}-\d{2}-\d{2}/.test(stR))?stR:`${YEAR}-${String(MONTH).padStart(2,'0')}-01`;
    const nt={mgr:who?who.id:'tak',country:String(svPick(o,['국가'])||'중국').trim()||'중국',name:nm,cat:String(svPick(o,['구분','R&R'])||'').trim(),kpi:String(svPick(o,['KPI관리기준'])||'').trim(),start:st0,due:toDateStr(svPick(o,['완료예정일']))||'상시',priority:prio,status,wk};
    const ex=TASKS.find(t=>t.mgr===nt.mgr && normName(t.name)===normName(nt.name));
    let target;
    if(ex){ if(!Array.isArray(ex.wk))ex.wk=[]; ex.wk[tIdx]=nt.wk[tIdx]; if(nt.cat&&!ex.cat)ex.cat=nt.cat; if(nt.kpi&&!ex.kpi)ex.kpi=nt.kpi; if(nt.due&&(!ex.due||ex.due==='상시'))ex.due=nt.due; if(nt.priority)ex.priority=nt.priority; if(nt.country)ex.country=nt.country; target=ex; }
    else { TASKS.push(nt); target=nt; }
    // 차주업무 → 다음 주 과제 이월 (다음 주 칸에 계획으로 0% 기입)
    if(nextW){ const ni=tIdx+1; if(ni<WEEKS.length){ if(!Array.isArray(target.wk))target.wk=[]; const cur=target.wk[ni]; if(!cur)target.wk[ni]={p:0,note:'▶ (전주 차주계획) '+nextW}; else if(!cur.note)cur.note='▶ (전주 차주계획) '+nextW; } }
    n++;
  });
  normalizeTasks(); saveTasks(); return n;
}

function setWeek(w){W=w;PERIOD='week';EOMSEL=false;MEND='';render();}

function stepMonth(d){MONTH=Math.min(12,Math.max(1,MONTH+d));WEEKS=buildWeeks(MONTH);W=Math.min(W,WEEKS.length-1);render();}
/* 주차 이동: 그 달의 끝을 넘어가면 다음 달 첫 주(그다음주)로, 첫 주 이전은 전달 마지막 주로 */
function stepWeek(d){let nw=W+d;
  if(nw>WEEKS.length-1){ if(MONTH<12){MONTH++;WEEKS=buildWeeks(MONTH);nw=0;} else nw=WEEKS.length-1; }
  else if(nw<0){ if(MONTH>1){MONTH--;WEEKS=buildWeeks(MONTH);nw=WEEKS.length-1;} else nw=0; }
  W=nw;PERIOD='week';render();
}
function setYear(y){YEAR=+y;render();}
function setMonthSel(v){
  EOMSEL=false;MEND='';
  if(v==='year'){PERIOD='year';render();return;}
  const m=+v;
  if(m!==MONTH){ MONTH=m; WEEKS=buildWeeks(MONTH);
    W=0; // 월 변경 시 가장 앞 주차 선택
    if(typeof MFMON!=='undefined')MFMON=String(TAB==='mreport'?Math.min(12,m+1):m); }  // 중점추진과제: 월간화면=+1개월, 주간화면=해당월
  if(PERIOD==='year')PERIOD='month'; else if(PERIOD!=='month')PERIOD='week';
  render();
}

function isoWeekNum(dateStr){const d=new Date(dateStr+'T00:00:00');if(isNaN(d))return '';const t=new Date(d.valueOf());const dn=(d.getDay()+6)%7;t.setDate(t.getDate()-dn+3);const ft=t.valueOf();t.setMonth(0,1);if(t.getDay()!==4){t.setMonth(0,1+((4-t.getDay())+7)%7);}return 1+Math.ceil((ft-t)/604800000);}

/* ============ 주간 엑셀 불러오기 (파일명에서 월·주차 인식 · 과제+실적 한 파일) ============ */
function toDateStr(v){
  if(v instanceof Date&&!isNaN(v))return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
  const m=String(v==null?'':v).match(/(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})/);
  if(m)return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  return String(v==null?'':v).trim();
}
/* ===== 연동 마스터(다중 탭) 라우팅: RR·SCHEDULE·WEEKLY·MARKET·DEAL·REV ===== */
function xsHeaderObjs(A){
  let h=-1;for(let i=0;i<A.length;i++){const ne=(A[i]||[]).filter(c=>String(c==null?'':c).trim()!=='').length;if(ne>=2){h=i;break;}}
  if(h<0)return [];
  const H=(A[h]||[]).map(c=>String(c==null?'':c).trim());const out=[];
  for(let r=h+1;r<A.length;r++){const row=A[r]||[];if(row.every(c=>String(c==null?'':c).trim()===''))continue;const o={};H.forEach((k,ci)=>{if(k)o[k]=row[ci];});out.push(o);}
  return out;
}

  const d=rowsOf('DEAL');if(d&&d.length){const n=applyDealRows(d);if(n)parts.push('실적 '+n+'건');}
  const cr=rowsOf('CORPREV');if(cr&&cr.length){const n=applyCorpRevRows(cr);if(n)parts.push('법인매출현황 '+n+'행');}

function importTasksXlsx(input){

    const wkKeys=['1주차','2주차','3주차','4주차','5주차'];
    const out=[];
    rows.forEach(row=>{

      const note=String(pick(row,['비고','메모']));

      if(!wk.some(Boolean)){
        const pv=pick(row,['진행률(%)','진행률','진행율','달성율']);
        if(pv!==''){const p=Math.max(0,Math.min(100,+pv||0));wk=WEEKS.map((_,k)=>k===W?{p,note}:null);}
      }
      if(!wk.some(Boolean))wk=WEEKS.map((_,k)=>k===Math.min(W,WEEKS.length-1)?{p:0,note}:null);
      out.push({mgr:m?m.id:'tak',country,name:nm,due,priority:prio,start:'2026-07-06',wk});

function salesMonthAgg(weeks,m){
  const inMo=weeks.filter(w=>(w.month||spMeta(w).month)===m);
  if(!inMo.length)return {m,cnExA:0,cnExT:0,cnSuA:0,cnSuT:0,htExA:0,htExT:0,has:false};
  const w=inMo[inMo.length-1], K=w.kpi||[];
  const g=(c,kind)=>K.filter(r=>r.country===c&&(r.metric||'').includes(kind)&&!/수량|EA/.test(r.metric||''));
  const sf=(arr,f)=>arr.reduce((s,r)=>s+(+r[f]||0),0);
  const cnEx=g('중국','수출'),cnSu=g('중국','수금'),htEx=[...g('홍콩','수출'),...g('대만','수출')];
  return {m,cnExA:sf(cnEx,'actual'),cnExT:sf(cnEx,'target'),cnSuA:sf(cnSu,'actual'),cnSuT:sf(cnSu,'target'),htExA:sf(htEx,'actual'),htExT:sf(htEx,'target'),has:true};
}
/* 거래처별 표(deal)에서 국가별 수출·수금 집계 — KPI카드·추이그래프 데이터원 */
function dealSummary(D){
  const s={cnExT:0,cnExA:0,cnSuT:0,cnSuA:0,twExT:0,twExA:0,hkExT:0,hkExA:0};
  (D||[]).forEach(d=>{const exT=+d.exT||0,exA=+d.exA||0,suT=+d.suT||0,suA=+d.suA||0;
    if(d.grp==='중국'){s.cnExT+=exT;s.cnExA+=exA;s.cnSuT+=suT;s.cnSuA+=suA;}
    else if((d.dealer||'').indexOf('대만')>=0){s.twExT+=exT;s.twExA+=exA;}
    else{s.hkExT+=exT;s.hkExA+=exA;}});
  return s;
}
function miniBarChart(title,unit,data,series,rateFn){
  const W=520,H=205,ml=42,mr=38,mt=12,mb=26,pw=W-ml-mr,ph=H-mt-mb,yb=mt+ph;
  const kv=v=>Math.round((v||0)/1000);
  const maxV=Math.max(1,...data.map(d=>Math.max(...series.map(s=>kv(d[s[0]])))));
  const band=pw/data.length, bw=Math.min(11,band*0.7/series.length);
  let grid='';
  for(let g=0;g<=4;g++){const y=yb-(g/4)*ph;grid+=`<line x1="${ml}" y1="${y}" x2="${W-mr}" y2="${y}" stroke="#eef" stroke-width="1"/><text x="${ml-5}" y="${y+3}" font-size="9" fill="#9498a3" text-anchor="end">${Math.round(maxV*g/4).toLocaleString()}</text><text x="${W-mr+5}" y="${y+3}" font-size="9" fill="#9498a3" text-anchor="start">${g*25}%</text>`;}
  let bars='',xlab='',line='',dots='';
  data.forEach((d,i)=>{const cx=ml+band*i+band/2;
    series.forEach((s,si)=>{const v=kv(d[s[0]]);const h=v/maxV*ph;const x=cx-(series.length*bw)/2+si*bw;bars+=`<rect x="${x.toFixed(1)}" y="${(yb-h).toFixed(1)}" width="${Math.max(1,bw-1.5).toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" fill="${s[1]}" opacity="${d.has?0.92:0.25}"/>`;});
    const ra=rateFn(d);if(ra!=null){const y=yb-Math.min(1,ra)*ph;line+=`${line?'L':'M'}${cx.toFixed(1)},${y.toFixed(1)} `;dots+=`<circle cx="${cx.toFixed(1)}" cy="${y.toFixed(1)}" r="2.8" fill="#c0392b"/><text x="${cx.toFixed(1)}" y="${(y-5).toFixed(1)}" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">${Math.round(ra*100)}%</text>`;}
    xlab+=`<text x="${cx.toFixed(1)}" y="${yb+15}" font-size="9.5" fill="${d.has?'#333':'#b8b8b8'}" text-anchor="middle" font-weight="${d.has?700:400}">${d.m}월</text>`;
  });
  const leg=series.map(s=>`<span class="lg-i"><i style="background:${s[1]}"></i>${s[2]}</span>`).join('')+`<span class="lg-i"><i style="background:#c0392b;border-radius:50%"></i>달성율</span>`;
  return `<div class="chbox"><div class="chbox-h" style="font-size:13px">${title} <span class="unit">${unit}</span></div><div class="chlegend" style="font-size:10.5px;gap:10px;margin-top:6px">${leg}</div><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:4px">${grid}${bars}${line?`<path d="${line}" fill="none" stroke="#c0392b" stroke-width="1.8"/>`:''}${dots}${xlab}</svg></div>`;
}

function dedupTasks(){
  const norm=s=>String(s||'').replace(/[\s ()（）·,.\-_/]+/g,'').toLowerCase();
  const seen={},out=[];
  for(const t of TASKS){const k=(t.mgr||'')+'|'+norm(t.name);if(seen[k])continue;seen[k]=1;out.push(t);}
  if(out.length!==TASKS.length){TASKS=out;saveTasks();}
}

function mergeWeeklyTasks(force){
  if(typeof WKREPORT==='undefined')return;
  const norm=x=>String(x||'').replace(/\s+/g,'').replace(/[()\u00b7,]/g,'').toLowerCase();
  const pnum=p=>{const v=parseInt(p);return isNaN(v)?60:v;};
  const isoIdx=iso=>{for(let m=7;m<=12;m++){const ws=buildWeeks(m);const i=ws.findIndex(x=>x.iso===+iso);if(i>=0)return {m,i,len:ws.length};}return null;};
  Object.keys(WKREPORT).forEach(wkk=>{
    const loc=isoIdx(wkk); if(!loc)return;
    (WKREPORT[wkk]||[]).forEach(r=>{
      let t=TASKS.find(x=>x.mgr===r.m&&(norm(x.name)===norm(r.t)||norm(x.name).includes(norm(r.t))||norm(r.t).includes(norm(x.name))));
      if(!t){
        t={mgr:r.m,country:(r.c||'중국'),name:r.t,start:'2026-0'+Math.min(9,loc.m)+'-01',
           due:(/^\d\d-\d\d$/.test(r.due||'')?('2026-'+r.due):(r.due||'상시')),
           priority:'중간',status:'진행중',wk:[]};
        TASKS.push(t);
      }
      if(!Array.isArray(t.wk))t.wk=[];
      while(t.wk.length<loc.len)t.wk.push(null);
      if(force||!t.wk[loc.i])t.wk[loc.i]={p:pnum(r.p),note:r.note||''};
      if(r.big)t.big=r.big; // 시트 대분류 → 과제진행율 그룹
      const lastP=pnum(r.p);
      t.status=lastP>=100?'완료':(lastP<=0?'예정':'진행중');
    });
  });
}
