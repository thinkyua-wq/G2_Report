    trendHtml+='<div class="hbars" style="margin-top:12px">'+tvals.map(t=>`<div class="hbar"><div class="hb-l">${esc(t.lb)}</div><div class="hb-track"><i style="width:${Math.max(3,t.v/tmax*100).toFixed(0)}%"></i></div><div class="hb-v">$${svFmt(t.v)}</div></div>`).join('')+'</div><div class="unit" style="margin-top:10px;color:#000">매주 「엑셀 불러오기」로 주차가 누적됩니다.</div>';
  } else trendHtml+='<div class="unit">주차 데이터 없음</div>';
  trendHtml+='</div>';
  if(SALESTAB==='corp'){
  html+='<div class="schart2" style="margin-top:8px"><div>'+corpTable()+'</div><div>'+trendHtml+'</div></div>';
  // 상세 표 (수정)
  html+=`<div class="chbox-h" style="margin:22px 0 8px;cursor:pointer" onclick="toggleSPtable()">상세 표 · 값 수정 <span class="unit">더블클릭 편집 · ${SPTABLE?'접기 ▴':'펼치기 ▾'}</span></div>`;
  if(SPTABLE){
    const num=(tbl,i,f)=>`<td class="snum" ondblclick="sEditNum('${tbl}',${i},'${f}',this)">${svFmt(SPCUR[tbl][i][f])}</td>`;
    html+='<div style="overflow-x:auto"><table class="ptable sperf"><thead><tr><th style="width:56px">국가</th><th style="text-align:left;width:130px">지표</th><th>목표</th><th>7월 예상</th><th>주차 실적</th><th>예상 달성률</th><th>주차 달성률</th><th style="text-align:left">비고</th></tr></thead><tbody>';
    K.forEach((r,i)=>{const er=(r.target&&r.expect!=null)?r.expect/r.target:null, ar=(r.target&&r.actual!=null)?r.actual/r.target:null;
      html+=`<tr><td>${esc(r.country||'')}</td><td class="rl">${esc(r.metric||'')}</td>${num('kpi',i,'target')}${num('kpi',i,'expect')}${num('kpi',i,'actual')}<td class="pc auto">${svPct(er)}</td><td class="pc auto">${svPct(ar)}</td><td class="rl memo" ondblclick="sEditTxt('kpi',${i},'note',this)">${esc(r.note||'')}</td></tr>`;});
    html+='</tbody></table></div>';
    html+='<div style="overflow-x:auto;margin-top:14px"><table class="ptable sperf"><thead><tr><th style="width:90px">법인</th><th style="text-align:left;width:130px">지역</th><th>7월 예상(만RMB)</th><th>달성률</th><th style="text-align:left">비고</th></tr></thead><tbody>';
    R.forEach((r,i)=>{const t2=(r.region&&/합계/.test(r.region))||r.corp==='전체';
      html+=`<tr class="${t2?'trtot':''}"><td>${esc(r.corp||'')}</td><td class="rl">${esc(r.region||'')}</td>${num('rev',i,'expect')}<td class="pc" ondblclick="sEditPct('rev',${i},'rate',this)">${svPct(r.rate)}</td><td class="rl memo" ondblclick="sEditTxt('rev',${i},'note',this)">${esc(r.note||'')}</td></tr>`;});
    html+='</tbody></table></div>';
  }
  }
  if(SALESTAB==='hq')html+=corpPerfModule();
  return html;
}
/* 등록관리 프로젝트 → 담당자 업무로 이관 (일정 미정은 플래그) · 등록관리 메뉴 삭제 */
function convertProjectsToTasks(){
  if(!PROJECTS.length)return; let flagged=0;
  for(let i=PROJECTS.length-1;i>=0;i--){const pj=PROJECTS[i];const mid=projMgrId(pj);if(!mid)continue;
    const undated=!isDate(pj.due), start=isDate(pj.start)?pj.start:'2026-07-01', due=isDate(pj.due)?pj.due:'상시';
    const note=(undated?'⚠ 일정 확인 필요 · ':'')+(pj.detail?String(pj.detail).split('\n')[0]:'');
    if(undated)flagged++;
    TASKS.push({mgr:mid,country:pj.country||'중국',name:pj.name,start,due,priority:'중간',status:undated?'예정':'진행중',wk:WEEKS.map((_,k)=>k===Math.min(W,WEEKS.length-1)?{p:undated?10:30,note}:null)});
    PROJECTS.splice(i,1);
  }
  saveTasks();saveProj();
  if(flagged)setTimeout(()=>toast(`프로젝트 ${flagged}건 일정 미정 → 담당자 업무현황에서 일정 확인 필요`),500);
}

/* 중복 과제 제거 · 과제명(공백/기호 무시) + 담당자 기준 */
function dedupTasks(){
  const norm=s=>String(s||'').replace(/[\s ()（）·,.\-_/]+/g,'').toLowerCase();
  const seen={},out=[];
  for(const t of TASKS){const k=(t.mgr||'')+'|'+norm(t.name);if(seen[k])continue;seen[k]=1;out.push(t);}
  if(out.length!==TASKS.length){TASKS=out;saveTasks();}
}
loadTasks();
normalizeTasks();
dedupTasks();
/* 오늘 일자 기준 주차로 자동 진입 · 오늘 주에 데이터 없으면 가장 최근 데이터 주로 폴백 */
(function(){
  const hasData=w=>TASKS.some(t=>(t.wk||[])[w]);
  const todayW=Math.max(0,Math.min(WEEKS.length-1,Math.floor((TODAY.getDate()-1)/7)));
  if(hasData(todayW)){W=todayW;return;}
  let last=-1;TASKS.forEach(t=>{const wk=t.wk||[];for(let i=wk.length-1;i>=0;i--){if(wk[i]){if(i>last)last=i;break;}}});
  W=(last>=0)?Math.max(0,Math.min(WEEKS.length-1,last)):todayW;
})();
loadPerf();
loadPlan();
normalizePlan();
/* 부서 성과목표(연간) KPI를 중국 목표 세부로 1회 이관 */
(function(){try{const c=(PLAN.cards||[]).find(x=>/중국/.test(x.mk));if(c&&!/법인매출/.test(c.sub||'')){c.sub=((c.sub||'').trim())+' · 법인매출 3.3억RMB · 본사수출 2,270만USD · 수량 115만개';savePlan();}}catch(e){}})();
loadMgrs();
loadMile();
loadProj();
normalizeProjects();
loadSPERF();
render();
</script>
